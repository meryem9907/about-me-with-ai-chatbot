name: Frontend 1.0 CI

on:
  pull_request:
    paths:
      - "frontend_1.0/**"
      - ".github/workflows/frontend-minimal-ci.yml"
  push:
    branches: [main, master]
    paths:
      - "frontend_1.0/**"
      - ".github/workflows/frontend-minimal-ci.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend_1.0/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

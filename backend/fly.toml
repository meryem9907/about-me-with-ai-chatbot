# fly.toml app configuration file generated for backend-serene-coral-7081 on 2026-08-19T07:45:46+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'backend-serene-coral-7081'
primary_region = 'gru'

[build]
  dockerfile = "Dockerfile"

[env]
  MODEL = "gemini-3.1-flash-lite"
  PROD_DOMAIN = "https://about-me-with-ai-chatbot.onrender.com"
  RATE_LIMIT_REQUESTS = "20"
  RATE_LIMIT_WINDOW_SEC = "60"
  ALLOW_GET_STREAM = "false"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[[mounts]]
  source = "chroma_data"
  destination = "/app/chroma_data"
